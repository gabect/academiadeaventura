name: Mountain Studio visual smoke
on:
  push:
    branches:
      - feature/studio-tree-curvature-grounding-v0.61.0
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright three@0.170.0
          npx playwright install --with-deps chromium
      - name: Bake licensed high-detail PNG tree sprites
        run: |
          python3 -m pip install --quiet Pillow
          node tools/fetch-licensed-tree-pngs.mjs
          python3 tools/bake-licensed-tree-atlases.py
      - name: CPU code invariants
        run: |
          node tests/mountain-studio-render-invariants.mjs
          node tests/mountain-studio-organic.mjs
          node tests/studio-organic-geometry.mjs
          node tests/studio-tree-impostors.mjs
          node tests/mountain-art-studio.mjs
          node tests/studio-hd-asset-validation.mjs
          THREE_MODULE="$GITHUB_WORKSPACE/node_modules/three/build/three.module.js" node tests/environment-smoke.mjs
      - name: Render app in SwiftShader WebGL
        run: |
          python3 -m http.server 8765 >/tmp/studio-server.log 2>&1 &
          node tests/studio-visual-smoke.mjs
      - name: Commit approved baked PNG sprites to the feature branch
        if: success() && github.ref == 'refs/heads/feature/studio-tree-curvature-grounding-v0.61.0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/studio_hd/trees/tree-pine-atlas.png assets/studio_hd/trees/tree-broadleaf-atlas.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(studio): verify tree atlas assets on v0.61.0"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mountain-studio-webgl-screenshots
          path: |
            artifacts/*.png
            artifacts/trees-*-art-preview.jpg
            assets/studio_hd/trees/*.png
          if-no-files-found: warn
