name: Mountain Studio visual smoke
on:
  push:
    branches:
      - feature/mountain-grounded-real-tree-sprites-v0.60.0
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright three@0.170.0 itchio-downloader
          python3 -m pip install --break-system-packages pillow
          npx playwright install --with-deps chromium
      - name: Download public, licensed tree images and bake PNG atlases
        run: |
          node tools/download-licensed-trees.mjs
          python3 tools/bake-licensed-trees.py /tmp/academia-trees.zip
          python3 -m http.server 8765 >/tmp/studio-server.log 2>&1 &
      - name: CPU code invariants
        run: |
          node tests/mountain-studio-render-invariants.mjs
          node tests/mountain-studio-organic.mjs
          node tests/studio-organic-geometry.mjs
          node tests/studio-tree-impostors.mjs
          node tests/mountain-art-studio.mjs
          node tests/studio-hd-asset-validation.mjs
          THREE_MODULE="$GITHUB_WORKSPACE/node_modules/three/build/three.module.js" node tests/environment-smoke.mjs
      - name: Render app in SwiftShader WebGL
        run: |
          node tests/studio-visual-smoke.mjs
      - name: Commit approved baked PNG sprites to the feature branch
        if: success() && github.ref == 'refs/heads/feature/mountain-full-tree-sprites-v0.59.0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/studio_hd/trees/tree-pine-atlas.png assets/studio_hd/trees/tree-broadleaf-atlas.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(studio): replace drawn trees with klamtii licensed sprites v0.60.0"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mountain-studio-webgl-screenshots
          path: |
            artifacts/*.png
            assets/studio_hd/trees/*.png
          if-no-files-found: warn
