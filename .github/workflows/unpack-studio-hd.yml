name: Unpack curated HD Studio assets
on:
  push:
    branches:
      - feature/mountain-studio-hd-assets
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[studio-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract painterly art into versioned game paths
        run: |
          set -euxo pipefail
          mkdir -p assets/studio_hd
          unzip -oq assets/studio_hd/AdventureAcademy_Studio_Curated_HD.zip -d assets/studio_hd
          test -s assets/studio_hd/tiles/rock.webp
          test -s assets/studio_hd/sprites/grass_tuft.webp
          test -s assets/studio_hd/sprites/fern.webp
          test -s assets/studio_hd/sprites/flowers_white.webp
          find assets/studio_hd -type f -maxdepth 3 -print | sort
      - name: Commit extracted assets to feature branch
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/studio_hd/tiles assets/studio_hd/sprites assets/studio_hd/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: extract game-ready WebP tiles and sprites [studio-extracted]'
            git push origin HEAD:feature/mountain-studio-hd-assets
          fi
