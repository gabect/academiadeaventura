name: Diorama classic camera + Tiny Swords scenery WebGL QA
on:
  push:
    branches: [main]
    paths:
      - 'diorama/index.html'
      - 'diorama/classic-camera.mjs'
      - 'diorama/tiny-swords-overworld.mjs'
      - 'diorama/crayon-terrain.mjs'
      - 'diorama/assets/tiny-overworld.webp'
      - 'diorama/assets/tiny-ground.webp'
      - 'diorama/assets/tiny-water.webp'
      - 'tests/diorama-tiny-swords.mjs'
      - 'tests/diorama-classic-camera.mjs'
      - 'diorama/personaje-3d.html'
      - 'tests/diorama-stylized-characters.mjs'
      - 'tests/diorama-stylized-browser.mjs'
      - '.github/workflows/diorama-3d-cast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test requirements
        run: |
          npm install --no-save --no-package-lock three@0.170.0 playwright
          npx playwright install --with-deps chromium
      - name: Check preserved original map and skeleton rig
        run: |
          node --check tests/diorama-stylized-characters.mjs
          node --check tests/diorama-stylized-browser.mjs
          node tests/diorama-stylized-characters.mjs
          node tests/diorama-directional-facing.mjs
          node --check diorama/classic-camera.mjs
          node --check tests/diorama-classic-camera.mjs
          node tests/diorama-classic-camera.mjs
          node --check diorama/tiny-swords-overworld.mjs
          node --check diorama/crayon-terrain.mjs
          node tests/diorama-tiny-swords.mjs
      - name: Verify original skeleton in desktop and mobile browsers
        run: |
          python3 -m http.server 8765 >/tmp/diorama-http.log 2>&1 &
          node tests/diorama-stylized-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-camera-and-skeleton-browser-screenshots
          path: artifacts/diorama-original-skeleton/*.png
          if-no-files-found: warn
