name: Audit realistic 3D-rendered CC0 tree PNGs
on:
  push:
    branches: [feature/studio-tree-art-rebuild-v0.60.0]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Access free klamtii tree sprites and inspect licensing
        run: node tools/audit-itch-trees.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itch-realistic-tree-assets
          path: art-audit/itch/
