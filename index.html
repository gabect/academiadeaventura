<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academia de Aventura — Prototipo</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#b7d4e4;font-family:system-ui,sans-serif}canvas{display:block}#hud{position:absolute;top:14px;left:14px;background:#182b32dc;color:white;padding:14px;border-radius:12px;max-width:300px}#hud h1{font-size:18px;margin:0 0 7px}#hud p{margin:5px 0;font-size:13px}#message{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#172b32ed;color:white;padding:12px 18px;border-radius:12px;text-align:center;max-width:85%;font-size:14px}#touch{position:absolute;right:16px;bottom:20px;display:grid;grid-template-columns:repeat(3,46px);gap:5px}#touch button{height:46px;border:0;border-radius:10px;background:#ffffffc9;font-size:20px;touch-action:none}#touch button:nth-child(1){grid-column:2}#touch button:nth-child(2){grid-column:1;grid-row:2}#touch button:nth-child(3){grid-column:2;grid-row:2}#touch button:nth-child(4){grid-column:3;grid-row:2}#touch button:nth-child(5){grid-column:2;grid-row:3}@media(pointer:fine){#touch{opacity:.5}}
#challenge{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#102533bb;padding:15px}
#challenge[hidden]{display:none}#challenge article{width:min(430px,95%);background:#f8efd9;border:3px solid #a18b68;border-radius:16px;padding:20px;color:#273a3a;box-shadow:0 10px 40px #0006}
#challenge h2{margin:0 0 10px}#answers{display:grid;gap:9px;margin:15px 0}#answers button,#exit{background:#3d695e;color:white;border:0;border-radius:9px;padding:13px;cursor:pointer;font-size:15px;text-align:left}#feedback{font-weight:600;min-height:20px}
@media(max-width:600px){#hud{max-width:57%;padding:9px;top:7px;left:7px}#hud h1{font-size:15px}#hud p{font-size:11px}#message{bottom:185px;font-size:12px}}</style></head>
<body><div id="hud"><h1>⚔ Academia de Aventura</h1><p>Demo 0.2 · Prueba del Aprendiz</p><p id="xp">XP: 0 · Misión: Habla con el guardián</p><p>WASD / flechas: moverse · E: interactuar</p></div><div id="message">Acércate al guardián junto a la torre.</div><div id="touch"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="KeyE">●</button><button data-key="ArrowRight">▶</button><button data-key="ArrowDown">▼</button></div>
<div id="challenge" hidden role="dialog" aria-modal="true" aria-labelledby="challengeTitle"><article><h2 id="challengeTitle">La Prueba del Aprendiz</h2><p id="progress"></p><p id="question"></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="exit" type="button">Regresar al patio</button></article></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9d4ee');scene.fog=new THREE.Fog('#a9d4ee',25,65);
const camera=new THREE.OrthographicCamera(-10,10,6,-6,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f5ff,0x6c7854,2));const sun=new THREE.DirectionalLight(0xffefcf,2.3);sun.position.set(-7,15,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.92,metalness:0});const grass=mat('#80aa71'),stone=mat('#9ca5a0'),wall=mat('#d5c6a6'),roof=mat('#745e68'),wood=mat('#73533d'),gold=mat('#efc56a'),blue=mat('#497e9e'),red=mat('#b8574b');
const boxCache=new Map(),cylCache=new Map();function box(w,h,d,m,x,y,z,parent=scene){const k=`${w}/${h}/${d}`;if(!boxCache.has(k))boxCache.set(k,new THREE.BoxGeometry(w,h,d));const o=new THREE.Mesh(boxCache.get(k),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(rt,rb,h,m,x,y,z,parent=scene,n=8){const k=`${rt}/${rb}/${h}/${n}`;if(!cylCache.has(k))cylCache.set(k,new THREE.CylinderGeometry(rt,rb,h,n));const o=new THREE.Mesh(cylCache.get(k),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(36,.5,36,grass,0,-.3,0);box(11,.12,15,stone,0,.02,0);
for(let i=-5;i<=5;i++)for(let j=-7;j<=7;j++)if((i+j)%7===0)box(.7,.04,.45,mat('#aeb6ac'),i,.105,j);
for(let x of [-12,12])for(let z of [-12,12]){cylinder(1.65,1.8,6,wall,x,3,z);cylinder(2.2,0,2.5,roof,x,7.2,z);for(let k=0;k<4;k++){const a=k*Math.PI/2;box(1.1,.7,1.1,wall,x+Math.cos(a)*1.1,6.2,z+Math.sin(a)*1.1)}}
for(let z=-10;z<=10;z+=2.1){box(2,2,1.5,wall,-13,1,z);box(2,2,1.5,wall,13,1,z)}for(let x=-11;x<=11;x+=2.1){box(1.5,2,2,wall,x,1,-13);box(1.5,2,2,wall,x,1,13)}
function tree(x,z){cylinder(.22,.32,2.5,wood,x,1.25,z);const leaves=mat('#4b8864');cylinder(0,1.65,3,leaves,x,3.3,z,scene,7);cylinder(0,1.2,2.2,leaves,x,4.6,z,scene,7)}
[[-9,-8],[9,-8],[-9,8],[9,8]].forEach(p=>tree(...p));
// Banderas de la academia creadas únicamente con geometría 3D.
for(const [x,z,m] of [[-6,-11.8,red],[6,-11.8,blue]]){cylinder(.07,.08,3,wood,x,4,z);box(1.3,1.2,.1,m,x+.65,4.8,z)}
for(const [x,z] of [[-7,0],[7,0]]){cylinder(.11,.14,2.4,wood,x,1.2,z);box(.5,.6,.5,gold,x,2.65,z)}
function person(color,accent){const g=new THREE.Group();cylinder(.55,.65,1.2,color,0,1.3,0,g,8);cylinder(.35,.35,.6,accent,0,2.2,0,g,10);box(.25,.8,.3,color,-.75,1.3,0,g);box(.25,.8,.3,color,.75,1.3,0,g);box(.3,.65,.35,wood,-.3,.35,0,g);box(.3,.65,.35,wood,.3,.35,0,g);return g}
const player=person(blue,mat('#eac7a1'));scene.add(player);player.position.set(0,0,5);
const guardian=person(red,gold);guardian.position.set(3,0,-3);scene.add(guardian);
const marker=cylinder(.1,.5,.7,gold,3,3.4,-3);marker.rotation.z=Math.PI;let xp=0,stage=0,challengeOpen=false,questionIndex=0,picked=[];
const keys=new Set();addEventListener('keydown',e=>{if(challengeOpen){if(e.code==='Escape')closeChallenge();return}keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE'&&!e.repeat)interact()});addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('#touch button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.key);if(b.dataset.key==='KeyE')interact()});for(let t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>keys.delete(b.dataset.key))});
const msg=document.getElementById('message'),status=document.getElementById('xp');
const challenge=document.getElementById('challenge'),progress=document.getElementById('progress'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback');
const bank=[
['¿En qué continente están las pirámides de Guiza?',['África','Asia','Europa'],0],
['¿Qué instrumento ayuda a encontrar el norte?',['Termómetro','Brújula','Cronómetro'],1],
['¿Cuál es el planeta rojo?',['Marte','Venus','Júpiter'],0],
['¿En qué país está la Torre Eiffel?',['España','Francia','Italia'],1],
['¿Cuántos lados tiene un hexágono?',['Cinco','Seis','Ocho'],1],
['¿Cuál es el océano más grande?',['Atlántico','Pacífico','Índico'],1],
['¿Cuál de estos es un mamífero?',['Tiburón','Trucha','Delfín'],2]
];
function closeChallenge(){challenge.hidden=true;challengeOpen=false;keys.clear()}
document.getElementById('exit').addEventListener('click',closeChallenge);
function showQuestion(){
 feedback.textContent='';answers.replaceChildren();progress.textContent='Pregunta '+(questionIndex+1)+' de 3';
 const [q,choices,correct]=picked[questionIndex];question.textContent=q;
 choices.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=choice;b.type='button';b.addEventListener('click',()=>{
 if(i!==correct){feedback.textContent='Intenta otra vez. ¡Tú puedes!';return}
 questionIndex++;
 if(questionIndex<3){showQuestion();return}
 progress.textContent='Prueba completada';question.textContent='¡Superaste los tres desafíos!';answers.replaceChildren();
 if(stage===0){stage=1;xp+=25;marker.visible=false;status.textContent='XP: '+xp+' · Prueba del Aprendiz completada';feedback.textContent='¡Ganaste 25 XP!';msg.textContent='Guardián: ¡Felicitaciones, aprendiz! Puedes volver a practicar.'}
 else feedback.textContent='¡Excelente! Puedes repetir la práctica sin ganar XP adicionales.';
 });answers.append(b)});
}
function interact(){
 if(challengeOpen)return;
 if(player.position.distanceTo(guardian.position)>2.8){msg.textContent='Acércate al guardián para conversar.';return}
 picked=[...bank].sort(()=>Math.random()-.5).slice(0,3);questionIndex=0;keys.clear();challengeOpen=true;challenge.hidden=false;showQuestion();
}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let right=0,forward=0;if(keys.has('KeyW')||keys.has('ArrowUp'))forward+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))forward-=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))right-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))right+=1;const l=Math.hypot(right,forward);if(l&&!challengeOpen){right/=l;forward/=l;const dx=right*.794-forward*.608,dz=-right*.608-forward*.794;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*dt*4,-10,10);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*dt*4,-10,10);player.rotation.y=Math.atan2(dx,dz)}camera.position.set(player.position.x+13,player.position.y+15,player.position.z+17);camera.lookAt(player.position.x,1,player.position.z);marker.rotation.y+=dt;renderer.render(scene,camera)}function resize(){const a=innerWidth/innerHeight;camera.left=-7*a;camera.right=7*a;camera.top=7;camera.bottom=-7;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();animate();
</script></body></html>
