<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academia de Aventura — Prototipo</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#b7d4e4;font-family:system-ui,sans-serif}canvas{display:block}#hud{position:absolute;top:14px;left:14px;background:#182b32dc;color:white;padding:14px;border-radius:12px;max-width:300px}#hud h1{font-size:18px;margin:0 0 7px}#hud p{margin:5px 0;font-size:13px}#message{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#172b32ed;color:white;padding:12px 18px;border-radius:12px;text-align:center;max-width:85%;font-size:14px}#touch{position:absolute;right:16px;bottom:20px;display:grid;grid-template-columns:repeat(3,46px);gap:5px}#touch button{height:46px;border:0;border-radius:10px;background:#ffffffc9;font-size:20px;touch-action:none}#touch button:nth-child(1){grid-column:2}#touch button:nth-child(2){grid-column:1;grid-row:2}#touch button:nth-child(3){grid-column:2;grid-row:2}#touch button:nth-child(4){grid-column:3;grid-row:2}#touch button:nth-child(5){grid-column:2;grid-row:3}@media(pointer:fine){#touch{opacity:.5}}</style></head>
<body><div id="hud"><h1>⚔ Academia de Aventura</h1><p>Demo 0.1 · Patio del Aprendiz</p><p id="xp">XP: 0 · Misión: Habla con el guardián</p><p>WASD / flechas: moverse · E: interactuar</p></div><div id="message">Acércate al guardián junto a la torre.</div><div id="touch"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="KeyE">●</button><button data-key="ArrowRight">▶</button><button data-key="ArrowDown">▼</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9d4ee');scene.fog=new THREE.Fog('#a9d4ee',25,65);
const camera=new THREE.OrthographicCamera(-10,10,6,-6,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f5ff,0x6c7854,2));const sun=new THREE.DirectionalLight(0xffefcf,2.3);sun.position.set(-7,15,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.92,metalness:0});const grass=mat('#80aa71'),stone=mat('#9ca5a0'),wall=mat('#d5c6a6'),roof=mat('#745e68'),wood=mat('#73533d'),gold=mat('#efc56a'),blue=mat('#497e9e'),red=mat('#b8574b');
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(rt,rb,h,m,x,y,z,parent=scene,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(36,.5,36,grass,0,-.3,0);box(11,.12,15,stone,0,.02,0);
for(let i=-5;i<=5;i++)for(let j=-7;j<=7;j++)if((i+j)%7===0)box(.7,.04,.45,mat('#aeb6ac'),i,.105,j);
for(let x of [-12,12])for(let z of [-12,12]){cylinder(1.65,1.8,6,wall,x,3,z);cylinder(2.2,0,2.5,roof,x,7.2,z);for(let k=0;k<4;k++){const a=k*Math.PI/2;box(1.1,.7,1.1,wall,x+Math.cos(a)*1.1,6.2,z+Math.sin(a)*1.1)}}
for(let z=-10;z<=10;z+=2.1){box(2,2,1.5,wall,-13,1,z);box(2,2,1.5,wall,13,1,z)}for(let x=-11;x<=11;x+=2.1){box(1.5,2,2,wall,x,1,-13);box(1.5,2,2,wall,x,1,13)}
function tree(x,z){cylinder(.22,.32,2.5,wood,x,1.25,z);const leaves=mat('#4b8864');cylinder(0,1.65,3,leaves,x,3.3,z,scene,7);cylinder(0,1.2,2.2,leaves,x,4.6,z,scene,7)}
[[-9,-8],[9,-8],[-9,8],[9,8]].forEach(p=>tree(...p));
function person(color,accent){const g=new THREE.Group();cylinder(.55,.65,1.2,color,0,1.3,0,g,8);cylinder(.35,.35,.6,accent,0,2.2,0,g,10);box(.25,.8,.3,color,-.75,1.3,0,g);box(.25,.8,.3,color,.75,1.3,0,g);box(.3,.65,.35,wood,-.3,.35,0,g);box(.3,.65,.35,wood,.3,.35,0,g);return g}
const player=person(blue,mat('#eac7a1'));scene.add(player);player.position.set(0,0,5);
const guardian=person(red,gold);guardian.position.set(3,0,-3);scene.add(guardian);
const marker=cylinder(.1,.5,.7,gold,3,3.4,-3);marker.rotation.z=Math.PI;let xp=0,stage=0;
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE')interact()});addEventListener('keyup',e=>keys.delete(e.code));
document.querySelectorAll('#touch button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.key);if(b.dataset.key==='KeyE')interact()});for(let t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>keys.delete(b.dataset.key))});
const msg=document.getElementById('message'),status=document.getElementById('xp');function interact(){if(player.position.distanceTo(guardian.position)>2.8){msg.textContent='Acércate al guardián para conversar.';return}if(stage===0){stage=1;xp=25;msg.textContent='Guardián: ¡Bienvenido! Has completado tu primera prueba. +25 XP. ¡Explora el patio!';status.textContent='XP: 25 · Misión completada: Bienvenida';marker.visible=false}else msg.textContent='Guardián: ¡Buen trabajo, aprendiz! Pronto habrá nuevas misiones.'}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let dx=0,dz=0;if(keys.has('KeyW')||keys.has('ArrowUp'))dz-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))dz+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))dx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))dx+=1;const l=Math.hypot(dx,dz);if(l){dx/=l;dz/=l;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*dt*4,-10,10);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*dt*4,-10,10);player.rotation.y=Math.atan2(dx,dz)}camera.position.set(player.position.x+13,player.position.y+15,player.position.z+17);camera.lookAt(player.position.x,1,player.position.z);marker.rotation.y+=dt;renderer.render(scene,camera)}function resize(){const a=innerWidth/innerHeight;camera.left=-7*a;camera.right=7*a;camera.top=7;camera.bottom=-7;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();animate();
</script></body></html>
